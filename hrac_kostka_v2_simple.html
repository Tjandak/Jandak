<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hrací kostka v2</title>
    <style>
        /* CSS: Vzhled a stylování stránky */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 280px;
        }

        h1 {
            color: #2d3748;
            margin-top: 0;
            font-size: 26px;
        }

        /* Vizuální podoba kostky s novými barvami a animací */
        .dice {
            width: 110px;
            height: 110px;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border: 3px solid #764ba2;
            border-radius: 20px;
            font-size: 52px;
            font-weight: bold;
            color: #764ba2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px auto;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            user-select: none;
        }

        .dice:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
        }

        /* Třída pro animaci otřesu při hodu */
        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }

        @keyframes shakeAnim {
            0% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-15deg) scale(1.1); }
            40% { transform: rotate(15deg) scale(1.1); }
            60% { transform: rotate(-10deg) scale(1.05); }
            80% { transform: rotate(10deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }

        /* Tlačítko s fialovým přechodem */
        button {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(118, 75, 162, 0.3);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(118, 75, 162, 0.4);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hrací kostka v2</h1>
        
        <!-- HTML: Zde se bude zobrazovat hozené číslo -->
        <div id="dice" class="dice">?</div>
        
        <!-- HTML: Tlačítko pro spuštění akce v JavaScriptu -->
        <button onclick="hodKostkou()">Hodit kostkou</button>
    </div>

    <script>
        // JAVASCRIPT: Logika aplikace
        function hodKostkou() {
            let kostkaElement = document.getElementById("dice");

            // 1. Přidáme animaci otřesu
            kostkaElement.classList.add("shake");

            // 2. Počkáme 200 ms (uprostřed animace) a změníme číslo
            setTimeout(function() {
                let cislo = Math.floor(Math.random() * 6) + 1;
                kostkaElement.textContent = cislo;
            }, 200);

            // 3. Po skončení animace odebereme třídu, aby šla spustit znovu
            setTimeout(function() {
                kostkaElement.classList.remove("shake");
            }, 400);
        }
    </script>

</body>
</html>
